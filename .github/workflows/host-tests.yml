name: Host tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy-and-protocol-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive

      - name: Build and run host tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends g++ libjansson-dev libcurl4-openssl-dev
          bash scripts/run-host-tests.sh

  windows-home-artwork-tests:
    runs-on: windows-2025
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare real NCA fixture
        shell: pwsh
        run: |
          corepack enable
          Push-Location tools/switchnow-forwarder-installer
          corepack pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          python -m pip install --disable-pip-version-check cryptography pillow
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/generate_home_artwork_fixture.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/decrypt_home_artwork_fixture.py

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build and run native artwork test
        shell: cmd
        run: |
          mkdir build\host-tests-windows
          cl /nologo /std:c++20 /EHsc /O2 /Iapp\src tests\nca_artwork_test.cpp app\src\nca_artwork.cpp bcrypt.lib /Fe:build\host-tests-windows\nca_artwork_test.exe
          build\host-tests-windows\nca_artwork_test.exe build\native-artwork-reference
